name: Plan Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  require-plan:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Require plan sections in PR body
        run: |
          BODY="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          REQUIRED=(
            "## Plan (required)"
            "- **Goal:**"
            "- **Scope (paths/files):**"
            "- **Steps:**"
            "- **Success criteria (verifiable):**"
            "- **Risks + mitigations:**"
            "- **Rollback / escalation plan:**"
            "## Evidence"
            "## Review checklist"
          )

          for section in "${REQUIRED[@]}"; do
            if ! grep -Fq -- "$section" <<< "$BODY"; then
              echo "Missing required PR section: $section"
              exit 1
            fi
          done

          echo "All required PR plan sections are present."
