name: Daily Inactivity Reminders
on:
  schedule:
    - cron: '0 15 * * *'  # 3 PM UTC / 8 AM PT daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry mode (no emails sent, no DB writes)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

jobs:
  send-reminders:
    name: Send inactivity reminders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send reminders
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL:         ${{ secrets.RESEND_FROM_EMAIL }}
          DRY_RUN:                   ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/send-reminders-cron.mjs
